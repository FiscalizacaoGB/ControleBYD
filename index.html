<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BYD - Registro de Roteiros</title>
  <meta name="theme-color" content="#0b2545" />

  <style>
    :root { --bg:#0b2545; --card:#ffffff; --muted:#6b7280; --accent:#facc15; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif; }
    html, body { height: 100%; }
    body { margin:0; background:#f3f4f6; color:#111827; }

    header { background:var(--bg); color:#fff; padding:14px 16px; }
    h1 { margin:0; font-size:20px; }
    header small { color:#cbd5e1; }

    main { padding:16px; max-width:640px; margin:0 auto; }
    .card {
      background:var(--card); border-radius:16px;
      padding:16px; box-shadow:0 6px 20px rgba(0,0,0,.06); margin-bottom:16px;
    }

    .field { margin-bottom:14px; }
    .field > label { display:block; color:var(--muted); font-size:14px; margin-bottom:6px; }
    input[type="text"], input[type="date"], input[type="time"], select, textarea {
      width:100%; padding:12px; border:1px solid #e5e7eb;
      border-radius:10px; background:#fff; font-size:16px;
    }
    textarea { resize:vertical; }
    .opcional { color:#9ca3af; font-size:13px; }
    input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
    select:disabled { background:#f3f4f6; color:#9ca3af; }

    .acoes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .turnos { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
    .opt input { position:absolute; opacity:0; pointer-events:none; }
    .opt span {
      display:block; text-align:center; padding:14px 6px;
      border:1px solid #d1d5db; border-radius:10px; background:#fff;
      cursor:pointer; font-size:15px;
    }
    .opt input:checked + span {
      background:var(--bg); color:var(--accent);
      border-color:var(--bg); font-weight:600;
    }
    .opt input:focus-visible + span { outline:2px solid var(--accent); }

    button#enviar {
      width:100%; padding:14px; border-radius:10px; border:none;
      background:var(--bg); color:#fff; font-size:16px; font-weight:600; cursor:pointer;
    }
    button#enviar:disabled { opacity:.6; cursor:default; }

    #msg { margin-top:12px; padding:10px 12px; border-radius:10px; font-size:14px; display:none; }
    #msg.ok { display:block; background:#dcfce7; color:#166534; }
    #msg.erro { display:block; background:#fee2e2; color:#991b1b; }

    footer { text-align:center; padding:16px; color:#6b7280; }
  </style>
</head>

<body>

<header>
  <h1>BYD - Registro de Roteiros</h1>
  <small>Chegada à fábrica e finalização do roteiro</small>
</header>

<main>
  <form id="form" class="card" autocomplete="off">

    <div class="field">
      <label for="data">Data</label>
      <input id="data" type="date" required />
    </div>

    <div class="field">
      <label>Turno</label>
      <div class="turnos" id="turnos"></div>
    </div>

    <div class="field">
      <label for="roteiro">Roteiro</label>
      <select id="roteiro" required disabled>
        <option value="">Selecione o turno primeiro</option>
      </select>
    </div>

    <div class="field">
      <label for="veiculo">Veículo</label>
      <input id="veiculo" type="text" required />
    </div>

    <div class="field">
      <label for="motorista">Motorista</label>
      <input id="motorista" type="text" required />
    </div>

    <div class="field">
      <label>Ação</label>
      <div class="acoes">
        <label class="opt">
          <input type="radio" name="acao" value="Chegada a Fábrica" required />
          <span>Chegada a Fábrica</span>
        </label>
        <label class="opt">
          <input type="radio" name="acao" value="Finalização do roteiro" />
          <span>Finalização do roteiro</span>
        </label>
      </div>
    </div>

    <div class="field">
      <label for="horario">Horário</label>
      <input id="horario" type="time" required />
    </div>

    <div class="field">
      <label for="justificativa">Justificativa <span class="opcional">(opcional)</span></label>
      <textarea id="justificativa" rows="2"></textarea>
    </div>

    <button id="enviar" type="submit">Enviar</button>
    <div id="msg"></div>
  </form>
</main>

<footer><small>&copy; Operação BYD</small></footer>

<script>
/* ==========================
   CONFIGURAÇÃO
========================== */

    "12H ÀS 21:30 - R01 - SALVADOR"
  ]

const form = document.getElementById("form");
const btn = document.getElementById("enviar");
const msg = document.getElementById("msg");
const selRoteiro = document.getElementById("roteiro");
const boxTurnos = document.getElementById("turnos");

/* Botões de turno */
Object.keys(ROTEIROS).forEach((turno, i) => {
  const lab = document.createElement("label");
  lab.className = "opt";
  lab.innerHTML = '<input type="radio" name="turno" required><span></span>';
  lab.querySelector("input").value = turno;
  lab.querySelector("span").textContent = turno;
  boxTurnos.appendChild(lab);
});

/* Ao escolher o turno, carrega os roteiros dele */
boxTurnos.addEventListener("change", () => {
  const turno = form.querySelector('input[name="turno"]:checked').value;
  selRoteiro.innerHTML = "";
  const ph = document.createElement("option");
  ph.value = "";
  ph.textContent = "Selecione o roteiro";
  selRoteiro.appendChild(ph);
  ROTEIROS[turno].forEach(r => {
    const op = document.createElement("option");
    op.value = op.textContent = r;
    selRoteiro.appendChild(op);
  });
  selRoteiro.disabled = false;
});

/* Data de hoje (horário local) como padrão */
function hojeISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
document.getElementById("data").value = hojeISO();

function mostrar(texto, tipo) {
  msg.textContent = texto;
  msg.className = tipo;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (btn.disabled) return;

  const dataISO = document.getElementById("data").value;
  const acao = form.querySelector('input[name="acao"]:checked');
  const turno = form.querySelector('input[name="turno"]:checked');
  if (!turno) { mostrar("Selecione o turno.", "erro"); return; }
  if (!selRoteiro.value) { mostrar("Selecione o roteiro.", "erro"); return; }
  if (!acao) { mostrar("Selecione a ação.", "erro"); return; }

  const registro = {
    data: dataISO.split("-").reverse().join("/"),
    roteiro: selRoteiro.value,
    veiculo: document.getElementById("veiculo").value.trim(),
    motorista: document.getElementById("motorista").value.trim(),
    acao: acao.value,
    horario: document.getElementById("horario").value,
    justificativa: document.getElementById("justificativa").value.trim()
  };

  btn.disabled = true;
  btn.textContent = "Enviando...";
  msg.className = "";

  try {
    const resp = await fetch(SHEETS_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(registro)
    });
    const json = await resp.json();

    if (json.status !== "ok") throw new Error(json.message || "Erro");

    mostrar("Registro enviado com sucesso!", "ok");

    /* Limpa os campos, mantendo data e turno */
    selRoteiro.value = "";
    ["veiculo", "motorista", "horario", "justificativa"].forEach(id => {
      document.getElementById(id).value = "";
    });
    acao.checked = false;
  } catch (err) {
    console.error(err);
    mostrar("Falha ao enviar. Verifique a conexão e tente novamente.", "erro");
  } finally {
    btn.disabled = false;
    btn.textContent = "Enviar";
  }
});
</script>

</body>
</html>
